spring.application.name=owner-microservice

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/owners_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:your_rabbitmq_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:your_rabbitmq_password}

